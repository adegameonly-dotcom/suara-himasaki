<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin HIMASAKI</title><style>body{margin:0;background:#f2f6f9;color:#183247;font:15px Arial}.bar{background:#102a43;color:white;padding:20px}.wrap{max-width:950px;margin:auto}.main{max-width:950px;margin:22px auto;padding:0 15px}.box{background:white;border:1px solid #dce6ed;border-radius:14px;padding:20px;margin-bottom:15px}label{display:block;font-size:13px;font-weight:bold;margin:12px 0 5px}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd9e2;border-radius:8px}textarea{min-height:80px}button{border:0;background:#269c91;color:white;padding:11px 14px;border-radius:8px;margin:5px 5px 5px 0;cursor:pointer}.secondary{background:#e8eff4;color:#183247}.danger{background:#b42318}.muted{color:#637789;font-size:13px;line-height:1.6}.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:15px 0}.tab.active{background:#176b87}.section[hidden],#dash[hidden]{display:none}.item{border:1px solid #dce6ed;padding:12px;border-radius:9px;margin:9px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.status{font-size:13px;color:#16766d}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style>
<div class="bar"><div class="wrap"><b>HIMASAKI · PANEL PENGURUS</b></div></div><main class="main"><section class="box" id="login"><h2>Masuk dengan Google</h2><p class="muted">Hanya email admin yang terdaftar yang dapat mengelola website.</p><div id="gbtn"></div><p id="loginmsg" class="muted">Google OAuth Client ID harus dikonfigurasi terlebih dahulu.</p></section><section id="dash" hidden><div class="box"><button class="secondary" onclick="logout()">Keluar</button><b id="who"></b><div class="tabs"><button class="tab active" data-id="home">Beranda</button><button class="tab" data-id="announce">Pengumuman</button><button class="tab" data-id="gallery">Galeri</button><button class="tab" data-id="asp">Aspirasi</button></div>
<div id="home" class="section"><h3>Edit beranda</h3><label>Nama organisasi</label><input id="orgName"><label>Teks logo</label><input id="logoText"><label>Judul utama</label><input id="heroTitle"><label>Deskripsi utama</label><textarea id="heroText"></textarea><label>Tentang HIMASAKI</label><textarea id="aboutText"></textarea><button onclick="save()">Simpan beranda</button></div>
<div id="announce" class="section" hidden><h3>Tambah pengumuman</h3><label>Judul</label><input id="at"><label>Isi</label><textarea id="ax"></textarea><label>URL gambar HTTPS (opsional)</label><input id="ai"><button onclick="add('announcement')">Terbitkan</button><div id="alist"></div></div>
<div id="gallery" class="section" hidden><h3>Tambah foto kegiatan</h3><label>Judul kegiatan</label><input id="gt"><label>Keterangan</label><textarea id="gx"></textarea><label>URL gambar HTTPS</label><input id="gi"><button onclick="add('gallery')">Tambah foto</button><div id="glist"></div></div>
<div id="asp" class="section" hidden><h3>Daftar aspirasi</h3><div id="asplist"></div></div><p id="status" class="status"></p></div></section></main>
<script src="https://accounts.google.com/gsi/client" async defer></script><script>
const API="TEMPEL_URL_APPS_SCRIPT_DI_SINI",CLIENT_ID="TEMPEL_GOOGLE_OAUTH_CLIENT_ID_DI_SINI";let token="",cache={};const $=id=>document.getElementById(id);
window.onload=()=>{if(!CLIENT_ID.startsWith("TEMPEL_")){google.accounts.id.initialize({client_id:CLIENT_ID,callback:loginDone});google.accounts.id.renderButton($("gbtn"),{theme:"outline",size:"large",text:"signin_with"});}};
async function loginDone(r){try{let p=JSON.parse(atob(r.credential.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));if(p.email.toLowerCase()!=="adegameonly@gmail.com"||!p.email_verified)throw Error("Email tidak diizinkan.");token=r.credential;let d=await api("adminData");if(!d.ok)throw Error(d.message);$("login").hidden=true;$("dash").hidden=false;$("who").textContent=p.email;fill(d)}catch(e){$("loginmsg").textContent=e.message}}
async function api(action,extra={}){if(API.startsWith("TEMPEL_"))throw Error("URL Apps Script belum diisi.");return await(await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action,idToken:token,...extra})})).json()}
function fill(d){cache=d;let s=d.settings||{};["orgName","logoText","heroTitle","heroText","aboutText"].forEach(k=>$(k).value=s[k]||"");list("alist",d.announcements,"announcement");list("glist",d.gallery,"gallery");$("asplist").innerHTML=(d.aspirations||[]).map((x,i)=>`<div class="item"><b>${esc(x[2])}</b> · ${esc(x[1])}<p>${esc(x[3])}</p><small>${esc(x[0])} · ${x[4]==="Ya"?"Anonim":esc(x[5])}</small><p>Status: ${esc(x[6])}</p><select id="s${i}"><option>Baru</option><option>Diproses</option><option>Selesai</option></select><button onclick="setst(${i})">Simpan status</button></div>`).join("")||"Belum ada aspirasi."}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function list(id,a,t){$(id).innerHTML=(a||[]).map((x,i)=>`<div class="item"><b>${esc(x.title)}</b><p>${esc(x.text)}</p><button class="danger" onclick="removeItem('${t}',${i})">Hapus</button></div>`).join("")||"Belum ada konten."}
async function save(){let settings={};["orgName","logoText","heroTitle","heroText","aboutText"].forEach(k=>settings[k]=$(k).value);await run("saveSettings",{settings})}
async function add(type){let p=type==="announcement"?"a":"g";await run("addContent",{type,item:{title:$(p+"t").value,text:$(p+"x").value,image:$(p+"i").value}});fill(await api("adminData"))}
async function removeItem(type,index){await run("removeContent",{type,index});fill(await api("adminData"))}
async function setst(index){await run("setStatus",{index,status:$("s"+index).value});fill(await api("adminData"))}
async function run(a,x){try{let d=await api(a,x);if(!d.ok)throw Error(d.message);$("status").textContent="Berhasil disimpan."}catch(e){$("status").textContent=e.message}}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".section").forEach(x=>x.hidden=true);$(b.dataset.id).hidden=false});
function logout(){token="";location.reload()}
</script></html>
